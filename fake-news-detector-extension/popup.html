<!DOCTYPE html>
<html>
  <head>
    <title>Fake News Detector</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h2>Fake News Detector</h2>
    <div style="display: flex; flex-direction: column; align-items: center;">
      <div class="spinner-container">
        <button id="analyze-button">
          <span class="fr-label">FR</span>
        </button>
        <span id="spinner" class="spinner-fancy" style="display:none;"></span>
      </div>
      <a href="#" id="toggle-text-input" style="display:block;margin-bottom:10px;">Or paste text instead</a>
    </div>
    <textarea id="text-input" rows="3" placeholder="Paste article text here" style="display:none;width:100%;"></textarea>
    <div id="result"></div>
    <script src="popup.js"></script>
  </body>
</html>
